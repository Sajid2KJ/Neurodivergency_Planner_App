<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Neuro Planner</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
 
<body>
  <div class="app">
 
    <header class="navbar">
      <h1>Neuro Planner</h1>
      <div class="nav-buttons">
        <button data-target="home">Home</button>
        <button data-target="planner">Planner</button>
        <button data-target="links">Help</button>
      </div>
    </header>
 
    <main class="content">
      <!-- Each <section> id matches a button's data-target above. -->
      <section id="home" class="card">
        <h2>Home</h2>
        <p>Overview of your day and focus.</p>
      </section>
 
      <section id="planner" class="card">
        <h2>Planner</h2>
        <p>Your tasks will appear here.</p>
      </section>
 
      <section id="links" class="card">
        <h2>Help & Resources</h2>
        <p>Tools and guidance for staying on track.</p>
      </section>
    </main>
 
  </div>
</body>
</html>
